[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verisci"
version = "0.1.0"
description = "Universal Scientific & Formal Verification Cartridges (Logic, Silicon, Systems, Matter)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Verifiable AI Architecture"}]
dependencies = []

[project.scripts]
verisci = "verisci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
